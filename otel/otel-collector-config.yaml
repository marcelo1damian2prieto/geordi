extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: geordi-otel-collector
        - name: service.namespace
          value: geordi
        - name: deployment.environment.name
          value: development
        - name: geordi.telemetry.origin
          value: platform
        - name: geordi.platform.component
          value: otel-collector
    logs:
      level: INFO
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_units: true
                without_type_suffix: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
