spring:
  application:
    name: geordi-backend
  datasource:
    url: ${GEORDI_ALERT_LIFECYCLE_DB_URL:jdbc:h2:file:./data/geordi-alerts;DB_CLOSE_ON_EXIT=FALSE}
    username: ${GEORDI_ALERT_LIFECYCLE_DB_USERNAME:sa}
    password: ${GEORDI_ALERT_LIFECYCLE_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration

geordi:
  modules:
    core:
      enabled: true
    metrics:
      enabled: true
    traces:
      enabled: true
    logs:
      enabled: true
    service-map:
      enabled: true
    slos:
      enabled: true
    alerts:
      enabled: true
    self-observability:
      enabled: true
  slo:
    definitions: []
  alert:
    policies: []
  metrics:
    victoria-metrics:
      base-url: http://localhost:8428
      connect-timeout: 2s
      read-timeout: 5s
  traces:
    tempo:
      base-url: http://localhost:3200
      connect-timeout: 2s
      read-timeout: 3s
  logs:
    loki:
      base-url: http://localhost:3100
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,geordiPlatform

logging:
  structured:
    format:
      console: logstash
