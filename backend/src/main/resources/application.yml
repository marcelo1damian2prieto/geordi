spring:
  application:
    name: geordi-backend
  datasource:
    url: ${GEORDI_ALERT_LIFECYCLE_DB_URL:jdbc:h2:file:./data/geordi-alerts;DB_CLOSE_ON_EXIT=FALSE}
    username: ${GEORDI_ALERT_LIFECYCLE_DB_USERNAME:sa}
    password: ${GEORDI_ALERT_LIFECYCLE_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration

geordi:
  security:
    issuer: ${GEORDI_OIDC_ISSUER}
    api-audience: ${GEORDI_API_AUDIENCE}
    browser-client-id: ${GEORDI_BROWSER_CLIENT_ID}
    browser-client-secret-file: ${GEORDI_BROWSER_CLIENT_SECRET_FILE:/run/secrets/geordi_oidc_client_secret}
    public-base-url: ${GEORDI_PUBLIC_BASE_URL}
    grant-claim: ${GEORDI_GRANT_CLAIM:geordi_permissions}
    grant-mapping:
      VIEWER: ["observability:read"]
      OPERATOR: ["observability:read", "alerts:acknowledge"]
      EVALUATOR: ["observability:read", "alerts:evaluate"]
  modules:
    core:
      enabled: true
    metrics:
      enabled: true
    traces:
      enabled: true
    logs:
      enabled: true
    service-map:
      enabled: true
    slos:
      enabled: true
    alerts:
      enabled: true
    self-observability:
      enabled: true
  slo:
    definitions: []
  alert:
    policies: []
  scheduling:
    alert:
      enabled: false
      interval: 1m
      worker-count: 2
      queue-capacity: 10
      shutdown-grace-period: 5s
  notification:
    enabled: false
    destination-id: primary-webhook
    token-header: X-Geordi-Token
    transitions: [ALERT_STARTED, ALERT_RESOLVED]
    connect-timeout: 1s
    read-timeout: 2s
    poll-interval: 1s
    lease-duration: 10s
    batch-size: 10
    maximum-attempts: 3
    allow-insecure-local-http: false
  metrics:
    victoria-metrics:
      base-url: http://localhost:8428
      connect-timeout: 2s
      read-timeout: 5s
  traces:
    tempo:
      base-url: http://localhost:3200
      connect-timeout: 2s
      read-timeout: 3s
  logs:
    loki:
      base-url: http://localhost:3100
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,geordiPlatform

logging:
  level:
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: OFF
    org.apache.coyote.http11.Http11Processor: OFF
    sun.net.www.protocol.http.HttpURLConnection: OFF
    jdk.httpclient.HttpClient: OFF
  structured:
    format:
      console: logstash
