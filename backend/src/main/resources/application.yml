spring:
  application:
    name: geordi-backend

geordi:
  modules:
    core:
      enabled: true
    metrics:
      enabled: true
    traces:
      enabled: true
    logs:
      enabled: true
    service-map:
      enabled: true
    slos:
      enabled: true
    self-observability:
      enabled: true
  slo:
    definitions: []
  metrics:
    victoria-metrics:
      base-url: http://localhost:8428
      connect-timeout: 2s
      read-timeout: 5s
  traces:
    tempo:
      base-url: http://localhost:3200
      connect-timeout: 2s
      read-timeout: 3s
  logs:
    loki:
      base-url: http://localhost:3100
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,geordiPlatform

logging:
  structured:
    format:
      console: logstash
