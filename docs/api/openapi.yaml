openapi: 3.1.0
info:
  title: Geordi Platform API
  version: milestone-9
  description: Platform APIs and bounded Metrics, Traces, Logs, observed Service Map, SLO, Burn Rate, and stateless Alert Evaluation capabilities.
servers:
  - url: http://localhost:8080
paths:
  /api/platform:
    get:
      operationId: getPlatform
      summary: Return Geordi platform identity.
      responses:
        '200':
          description: Platform identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
  /api/modules:
    get:
      operationId: getModules
      summary: Return all installed compile-time modules ordered by id.
      responses:
        '200':
          description: Registered modules, including disabled modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modules'
  /api/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Return aggregate platform and module health.
      description: >-
        Always returns HTTP 200 when the backend can answer, even when the reported
        status is DOWN. Disabled modules are not health-checked and do not degrade
        aggregate status.
      responses:
        '200':
          description: Aggregate platform health and module health snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealth'
  /api/metrics/services:
    get:
      operationId: listMonitoredServices
      summary: List monitored services with metrics in a bounded time range.
      description: Only explicitly classified monitored workload telemetry is returned.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Services ordered by their composite OpenTelemetry identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredServices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/MetricsUnavailable'
        '404':
          $ref: '#/components/responses/MetricsDisabled'
  /api/metrics/overview:
    get:
      operationId: getMetricsOverview
      summary: Return the fixed operational metrics overview for one service.
      parameters:
        - $ref: '#/components/parameters/ServiceName'
        - $ref: '#/components/parameters/ServiceNamespace'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Latest available values for the supported operational metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/MetricsUnavailable'
        '404':
          $ref: '#/components/responses/MetricsDisabled'
  /api/metrics/series:
    get:
      operationId: queryMetricSeries
      summary: Query one or more supported operational metric series.
      description: Resolution is selected by Geordi; backend query languages are never accepted.
      parameters:
        - $ref: '#/components/parameters/ServiceName'
        - $ref: '#/components/parameters/ServiceNamespace'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: metric
          in: query
          required: true
          description: Repeat this parameter to request several supported series.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: '#/components/schemas/OperationalMetric'
          explode: true
      responses:
        '200':
          description: Ordered requested series; missing telemetry produces an empty points array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeriesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/MetricsUnavailable'
        '404':
          $ref: '#/components/responses/MetricsDisabled'
  /api/traces/services:
    get:
      operationId: listTraceServices
      summary: List monitored services with traces in a bounded half-open time range.
      description: >-
        Results include only explicitly monitored traces
        and are ordered by exact service namespace/name/environment identity.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Services with monitored traces in the requested [from, to) interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceServices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/TracesUnavailable'
        '502':
          $ref: '#/components/responses/TracesMalformedResponse'
        '504':
          $ref: '#/components/responses/TracesTimeout'
        '404':
          $ref: '#/components/responses/TracesDisabled'
  /api/traces:
    get:
      operationId: searchTraces
      summary: Search trace summaries for one exact monitored service identity.
      description: >-
        Search is constrained to [from, to), at most six
        hours and 50 summaries. TraceQL, arbitrary attributes and provider filters are
        never accepted.
      parameters:
        - $ref: '#/components/parameters/TraceServiceName'
        - $ref: '#/components/parameters/TraceServiceNamespace'
        - $ref: '#/components/parameters/TraceEnvironment'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: errorOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Deterministically ordered trace summaries, up to 50.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/TracesUnavailable'
        '502':
          $ref: '#/components/responses/TracesMalformedResponse'
        '504':
          $ref: '#/components/responses/TracesTimeout'
        '404':
          $ref: '#/components/responses/TracesDisabled'
  /api/traces/{traceId}:
    get:
      operationId: getTrace
      summary: Return complete available span data for one trace.
      description: Provider-specific payloads are never returned.
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Trace detail with complete available span data and deterministic hierarchy ordering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TraceNotFound'
        '503':
          $ref: '#/components/responses/TracesUnavailable'
        '502':
          $ref: '#/components/responses/TracesMalformedResponse'
        '504':
          $ref: '#/components/responses/TracesTimeout'
  /api/logs/services:
    get:
      operationId: listLogServices
      summary: List monitored services with logs in a bounded half-open time range.
      description: Only explicitly classified monitored workload logs are returned.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Services with monitored logs in the requested [from, to) interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogServices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/LogsMalformedResponse'
        '503':
          $ref: '#/components/responses/LogsUnavailable'
        '504':
          $ref: '#/components/responses/LogsTimeout'
        '404':
          $ref: '#/components/responses/LogsDisabled'
  /api/logs:
    get:
      operationId: searchLogs
      summary: Search bounded log records for one exact monitored service identity.
      description: >-
        Search is constrained to [from, to), at most six hours and at most 200 records.
        Text is a literal substring, not LogQL, regex, or a provider query language.
      parameters:
        - $ref: '#/components/parameters/LogServiceName'
        - $ref: '#/components/parameters/LogServiceNamespace'
        - $ref: '#/components/parameters/LogEnvironment'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LogSeverity'
        - name: text
          in: query
          required: false
          description: Literal substring filter; no regex or provider syntax.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: traceId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TraceId'
        - name: spanId
          in: query
          required: false
          description: Requires traceId when supplied.
          schema:
            $ref: '#/components/schemas/SpanId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Deterministically newest-first log records; an empty logs array is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/LogsMalformedResponse'
        '503':
          $ref: '#/components/responses/LogsUnavailable'
        '504':
          $ref: '#/components/responses/LogsTimeout'
        '404':
          $ref: '#/components/responses/LogsDisabled'
  /api/service-map:
    get:
      operationId: getServiceMap
      summary: Return observed service-to-service dependencies for one environment and bounded time range.
      description: >-
        The map is derived from available monitored trace evidence, not configured or
        complete architecture. An edge is returned only for a direct monitored CLIENT
        parent and SERVER child with distinct exact service identities in the requested
        environment, where the SERVER span starts in [from, to). Absence of an edge does
        not prove absence of a dependency. Results are bounded and truncated is explicit.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: >-
            A bounded observed graph. Empty nodes and edges are valid when no qualifying
            dependency was observed. A true truncated value means the result is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ServiceMapDisabled'
        '502':
          $ref: '#/components/responses/TracesMalformedResponse'
        '503':
          $ref: '#/components/responses/TracesUnavailable'
        '504':
          $ref: '#/components/responses/TracesTimeout'
  /api/slos:
    get:
      operationId: listSlos
      summary: List deployment-managed SLO definitions.
      description: >-
        Returns the read-only YAML catalog. Definitions contain only canonical Geordi
        concepts and never provider query expressions or telemetry values.
      responses:
        '200':
          description: SLO definitions ordered deterministically by name then identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloDefinitions'
        '404':
          $ref: '#/components/responses/SlosDisabled'
  /api/slos/{sloId}:
    get:
      operationId: getSlo
      summary: Return one deployment-managed SLO definition.
      parameters:
        - $ref: '#/components/parameters/SloId'
      responses:
        '200':
          description: The requested canonical SLO definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloDefinition'
        '404':
          description: The SLO capability is disabled or the identifier is not in the configured catalog.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/slos/{sloId}/evaluation:
    get:
      operationId: evaluateSlo
      summary: Evaluate one SLO over its configured whole window.
      description: >-
        The returned range is the exact half-open [from,to) evaluation interval. A
        telemetry problem is represented by status UNAVAILABLE and a reason, not a
        breached result or provider-specific error. Equality with a configured target
        is MET for both supported SLI target directions. Error-budget and burn-rate
        evidence is derived from the same canonical request-outcome measurement and
        exact range as the objective status.
      parameters:
        - $ref: '#/components/parameters/SloId'
      responses:
        '200':
          description: Explainable current evaluation, including unavailable outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloEvaluation'
        '404':
          description: The SLO capability is disabled or the identifier is not in the configured catalog.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/alert-policies:
    get:
      operationId: listAlertPolicies
      summary: List deployment-managed alert policies.
      description: >-
        Returns the read-only YAML catalog. Policies contain one explicit canonical
        burn-rate condition and no provider query, notification, or lifecycle fields.
      responses:
        '200':
          description: Alert policies ordered deterministically by name then identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicies'
        '404':
          $ref: '#/components/responses/AlertEvaluationDisabled'
  /api/alert-policies/{policyId}/evaluation:
    get:
      operationId: evaluateAlertPolicy
      summary: Evaluate one alert policy against canonical burn-rate evidence.
      description: >-
        BURN_RATE_ABOVE uses the inclusive comparison canonical burnRate >= threshold.
        The evidence range and evaluatedAt are the exact values returned by the
        referenced SLO/Burn snapshot. Missing or unavailable evidence produces
        UNAVAILABLE, never CONDITION_NOT_MET. This read is side-effect free: it sends
        no notification and creates no incident or persistent alert instance.
      parameters:
        - $ref: '#/components/parameters/AlertPolicyId'
      responses:
        '200':
          description: Explainable stateless condition evaluation, including unavailable outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEvaluation'
        '404':
          description: The capability is disabled or the policy identifier is not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AlertPolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SloId:
      name: sloId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ServiceName:
      name: serviceName
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    ServiceNamespace:
      name: serviceNamespace
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Environment:
      name: environment
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    TraceServiceName:
      name: serviceName
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    TraceServiceNamespace:
      name: serviceNamespace
      in: query
      required: false
      description: >-
        When omitted, matches only traces with a canonical null/absent service namespace;
        it never widens the search to every namespace.
      schema:
        type: string
        minLength: 1
    TraceEnvironment:
      name: environment
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    LogServiceName:
      name: serviceName
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    LogServiceNamespace:
      name: serviceNamespace
      in: query
      required: false
      description: >-
        When omitted, matches only logs with a canonical null/absent service namespace;
        it never widens the search to every namespace.
      schema:
        type: string
        minLength: 1
    LogEnvironment:
      name: environment
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: The service identity, range, or requested metric is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MetricsUnavailable:
      description: Metrics storage could not answer the bounded query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MetricsDisabled:
      description: The Metrics capability is disabled and its routes are absent.
    TracesUnavailable:
      description: Trace storage could not answer the bounded query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TracesMalformedResponse:
      description: Trace storage returned a malformed or partial response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TracesTimeout:
      description: Trace storage exceeded the bounded query timeout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TracesDisabled:
      description: The Traces capability is disabled and its routes are absent.
    TraceNotFound:
      description: No trace exists for the valid requested trace ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LogsUnavailable:
      description: Log storage could not answer the bounded query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LogsMalformedResponse:
      description: Log storage returned a malformed or partial response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LogsTimeout:
      description: Log storage exceeded the bounded query timeout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LogsDisabled:
      description: The Logs capability is disabled and its routes are absent.
    ServiceMapDisabled:
      description: The Service Map capability is disabled or its trace dependency is unavailable by configuration.
    SlosDisabled:
      description: The SLO capability is disabled and its routes are absent.
    AlertEvaluationDisabled:
      description: The Alert Evaluation capability is disabled and its routes are absent.
  schemas:
    Platform:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id:
          type: string
          const: geordi
        name:
          type: string
          const: Geordi
        version:
          type: string
          description: Application version derived from Maven build metadata.
          example: 0.1.0-SNAPSHOT
    ModuleStatus:
      type: string
      enum: [UP, DOWN, UNKNOWN, DISABLED]
    ModuleInventory:
      type: object
      additionalProperties: false
      required: [id, name, enabled]
      properties:
        id:
          type: string
          example: self-observability
        name:
          type: string
          example: Self Observability
        enabled:
          type: boolean
    ModuleHealth:
      type: object
      additionalProperties: false
      required: [id, name, enabled, status]
      properties:
        id:
          type: string
          example: self-observability
        name:
          type: string
          example: Self Observability
        enabled:
          type: boolean
        status:
          $ref: '#/components/schemas/ModuleStatus'
    Modules:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleInventory'
    PlatformHealth:
      type: object
      additionalProperties: false
      required: [status, modules]
      properties:
        status:
          $ref: '#/components/schemas/ModuleStatus'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleHealth'
    ServiceIdentity:
      type: object
      additionalProperties: false
      required: [name, namespace, environment]
      properties:
        name:
          type: string
          example: geordi-demo-service
        namespace:
          type: [string, 'null']
          example: geordi-demo
        environment:
          type: string
          example: development
    TimeRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ServiceMapContext:
      type: object
      additionalProperties: false
      required: [environment, range]
      properties:
        environment:
          type: string
          minLength: 1
          description: Exact deployment.environment.name selected for the map.
        range:
          $ref: '#/components/schemas/TimeRange'
    DependencyEvidence:
      type: object
      additionalProperties: false
      required: [traceId, observedAt]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        observedAt:
          type: string
          format: date-time
          description: Start timestamp of the qualifying SERVER span.
    ObservedDependency:
      type: object
      additionalProperties: false
      required: [caller, callee, evidenceCount, evidence]
      properties:
        caller:
          $ref: '#/components/schemas/ServiceIdentity'
        callee:
          $ref: '#/components/schemas/ServiceIdentity'
        evidenceCount:
          type: integer
          minimum: 1
          description: Count of distinct qualifying trace IDs for this ordered caller-to-callee edge.
        evidence:
          type: array
          maxItems: 3
          description: At most three deterministic representative traces; this is not the complete evidence set.
          items:
            $ref: '#/components/schemas/DependencyEvidence'
    ServiceMap:
      type: object
      additionalProperties: false
      required: [context, nodes, edges, truncated]
      properties:
        context:
          $ref: '#/components/schemas/ServiceMapContext'
        nodes:
          type: array
          maxItems: 50
          description: Exact canonical service identities that are endpoints of returned observed edges.
          items:
            $ref: '#/components/schemas/ServiceIdentity'
        edges:
          type: array
          maxItems: 100
          description: Ordered caller-to-callee observed dependencies. Same-service edges are omitted.
          items:
            $ref: '#/components/schemas/ObservedDependency'
        truncated:
          type: boolean
          description: >-
            True when candidate, node, or edge bounds prevent a complete graph. The
            representative evidence list is always bounded; evidenceCount greater than
            evidence length makes that boundedness explicit without changing this flag.
    SliType:
      type: string
      description: Closed canonical SLI catalog for Milestone 7.
      enum: [AVAILABILITY, ERROR_RATE]
    SloWindow:
      type: string
      description: Predefined ISO-8601 whole evaluation window.
      enum: [PT5M, PT15M, PT1H, PT6H]
    SloStatus:
      type: string
      enum: [MET, BREACHED, UNAVAILABLE]
    SloUnavailableReason:
      type: [string, 'null']
      description: Present only when the evaluation status is UNAVAILABLE.
      enum: [DISABLED, NO_TRAFFIC, MISSING_REQUEST_COUNT, MISSING_ERROR_COUNT, INVALID_TELEMETRY, METRICS_UNAVAILABLE, null]
    BurnRateStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    BurnRateUnavailableReason:
      type: [string, 'null']
      description: Present only when burn-rate status is UNAVAILABLE.
      enum: [DISABLED, NO_TRAFFIC, MISSING_REQUEST_COUNT, MISSING_ERROR_COUNT, INVALID_TELEMETRY, METRICS_UNAVAILABLE, ZERO_ALLOWED_BAD_RATIO, null]
    AlertConditionType:
      type: string
      description: Closed canonical Alert Evaluation condition catalog for Milestone 9.
      enum: [BURN_RATE_ABOVE]
    AlertEvaluationStatus:
      type: string
      enum: [CONDITION_MET, CONDITION_NOT_MET, UNAVAILABLE]
    AlertUnavailableReason:
      type: [string, 'null']
      description: Present only when the alert evaluation status is UNAVAILABLE.
      enum: [DISABLED, NO_TRAFFIC, MISSING_REQUEST_COUNT, MISSING_ERROR_COUNT, INVALID_TELEMETRY, METRICS_UNAVAILABLE, ZERO_ALLOWED_BAD_RATIO, null]
    AlertCondition:
      type: object
      additionalProperties: false
      required: [type, threshold]
      properties:
        type:
          $ref: '#/components/schemas/AlertConditionType'
        threshold:
          type: number
          format: double
          minimum: 0
          description: >-
            Non-negative finite dimensionless burn-rate multiple. BURN_RATE_ABOVE is
            inclusive: equality with this threshold is condition met. Positive values
            must remain nonzero and finite in the IEEE-754 public contract.
          example: 2
    AlertPolicy:
      type: object
      additionalProperties: false
      required: [id, name, description, enabled, sloId, condition]
      properties:
        id:
          type: string
          minLength: 1
          example: checkout-availability-burn
        name:
          type: string
          minLength: 1
          example: Checkout availability burn
        description:
          type: [string, 'null']
        enabled:
          type: boolean
        sloId:
          type: string
          minLength: 1
        condition:
          $ref: '#/components/schemas/AlertCondition'
    AlertPolicies:
      type: object
      additionalProperties: false
      required: [alertPolicies]
      properties:
        alertPolicies:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AlertPolicy'
    AlertEvidence:
      type: object
      additionalProperties: false
      required: [service, window, range, evaluatedAt, observedBurnRate]
      properties:
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        window:
          $ref: '#/components/schemas/SloWindow'
        range:
          $ref: '#/components/schemas/TimeRange'
        evaluatedAt:
          type: string
          format: date-time
          description: Equal to range.to; inherited from the canonical SLO/Burn snapshot.
        observedBurnRate:
          type: [number, 'null']
          format: double
          minimum: 0
          description: >-
            Canonical M8 burn-rate multiple, or null when burn evidence is unavailable.
            Numeric values are finite and are compared before UI formatting.
    AlertEvaluation:
      type: object
      additionalProperties: false
      required: [policyId, policyName, sloId, condition, status, reason, evidence]
      properties:
        policyId:
          type: string
          minLength: 1
        policyName:
          type: string
          minLength: 1
        sloId:
          type: string
          minLength: 1
        condition:
          $ref: '#/components/schemas/AlertCondition'
        status:
          $ref: '#/components/schemas/AlertEvaluationStatus'
        reason:
          $ref: '#/components/schemas/AlertUnavailableReason'
        evidence:
          oneOf:
            - $ref: '#/components/schemas/AlertEvidence'
            - type: 'null'
          description: >-
            Null only when a disabled policy was not evaluated. Enabled unavailable
            evaluations preserve their exact canonical evidence context.
    SloDefinition:
      type: object
      additionalProperties: false
      required: [id, name, description, service, sliType, target, window, enabled]
      properties:
        id:
          type: string
          minLength: 1
          example: checkout-availability
        name:
          type: string
          minLength: 1
          example: Checkout availability
        description:
          type: [string, 'null']
          example: Successful checkout requests in production.
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        sliType:
          $ref: '#/components/schemas/SliType'
        target:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Unitless ratio in [0,1], never a percentage. Availability is met when the
            observed value is greater than or equal to target; error rate is met when
            it is less than or equal to target. Every nonzero value must remain finite
            and nonzero as an IEEE-754 double, and a definition is rejected when its
            positive allowed bad ratio could produce a burn rate outside that contract.
          example: 0.999
        window:
          $ref: '#/components/schemas/SloWindow'
        enabled:
          type: boolean
    SloDefinitions:
      type: object
      additionalProperties: false
      required: [slos]
      properties:
        slos:
          type: array
          items:
            $ref: '#/components/schemas/SloDefinition'
    SloEvaluation:
      type: object
      additionalProperties: false
      required: [sloId, service, sliType, target, window, range, evaluatedAt, observedValue, requestCount, status, reason, burnRateEvaluation]
      properties:
        sloId:
          type: string
          minLength: 1
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        sliType:
          $ref: '#/components/schemas/SliType'
        target:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            The validated definition target, represented by the same finite IEEE-754
            double contract as the catalog response.
        window:
          $ref: '#/components/schemas/SloWindow'
        range:
          $ref: '#/components/schemas/TimeRange'
        evaluatedAt:
          type: string
          format: date-time
        observedValue:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Null when evaluation is unavailable. For availability it is (N-E)/N; for
            error rate it is E/N, using whole-window request counts. A positive result
            is never rounded or underflowed to zero in the public numeric contract.
        requestCount:
          type: [number, 'null']
          format: double
          minimum: 0
          description: >-
            Whole-window total request count, or null when unavailable. Providers may
            extrapolate counter increases, so this canonical value is not restricted
            to whole integers.
        status:
          $ref: '#/components/schemas/SloStatus'
        reason:
          $ref: '#/components/schemas/SloUnavailableReason'
        burnRateEvaluation:
          $ref: '#/components/schemas/BurnRateEvaluation'
    BurnRateEvaluation:
      type: object
      additionalProperties: false
      required: [allowedBadRatio, observedBadRatio, burnRate, status, reason]
      properties:
        allowedBadRatio:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Unitless allowed bad-event ratio. It is 1-target for AVAILABILITY and
            target for ERROR_RATE, within the finite IEEE-754 double contract.
        observedBadRatio:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Whole-window E/N ratio, or null when telemetry is unavailable. A positive
            result is never rounded or underflowed to zero.
        burnRate:
          type: [number, 'null']
          format: double
          minimum: 0
          description: >-
            Dimensionless observedBadRatio/allowedBadRatio multiple. Null when burn
            evidence is unavailable, including a zero allowed bad ratio. A numeric
            value is always finite in the IEEE-754 double contract.
        status:
          $ref: '#/components/schemas/BurnRateStatus'
        reason:
          $ref: '#/components/schemas/BurnRateUnavailableReason'
    OperationalMetric:
      type: string
      enum:
        - JVM_MEMORY_USED
        - JVM_CPU_UTILIZATION
        - JVM_THREAD_COUNT
        - JVM_GC_DURATION
        - HTTP_REQUEST_RATE
        - HTTP_REQUEST_COUNT
        - HTTP_REQUEST_LATENCY_P95
        - HTTP_ERROR_RATE
        - HTTP_ERROR_COUNT
    MetricUnit:
      type: string
      enum: [By, '1', '{thread}', s, '{request}/s', '{request}']
    MetricPoint:
      type: object
      additionalProperties: false
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
          format: double
    MetricValue:
      type: object
      additionalProperties: false
      required: [metric, unit, value, timestamp]
      properties:
        metric:
          $ref: '#/components/schemas/OperationalMetric'
        unit:
          $ref: '#/components/schemas/MetricUnit'
        value:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
    MetricSeries:
      type: object
      additionalProperties: false
      required: [metric, unit, points]
      properties:
        metric:
          $ref: '#/components/schemas/OperationalMetric'
        unit:
          $ref: '#/components/schemas/MetricUnit'
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
    MonitoredServices:
      type: object
      additionalProperties: false
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceIdentity'
    MetricsOverview:
      type: object
      additionalProperties: false
      required: [service, range, values]
      properties:
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        range:
          $ref: '#/components/schemas/TimeRange'
        values:
          type: array
          items:
            $ref: '#/components/schemas/MetricValue'
    MetricSeriesResult:
      type: object
      additionalProperties: false
      required: [service, range, series]
      properties:
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        range:
          $ref: '#/components/schemas/TimeRange'
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
    TraceId:
      type: string
      description: Lowercase 32-character hexadecimal OpenTelemetry trace ID.
      pattern: '^[0-9a-f]{32}$'
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    SpanId:
      type: string
      description: Lowercase 16-character hexadecimal OpenTelemetry span ID.
      pattern: '^[0-9a-f]{16}$'
      example: 00f067aa0ba902b7
    LogSeverity:
      type: string
      description: Canonical group mapped from OpenTelemetry numeric severity.
      enum: [UNSPECIFIED, TRACE, DEBUG, INFO, WARN, ERROR, FATAL]
    LogRecord:
      type: object
      additionalProperties: false
      required: [timestamp, observedTimestamp, severity, severityText, body, service, traceId, spanId, attributes]
      properties:
        timestamp:
          type: string
          format: date-time
        observedTimestamp:
          type: [string, 'null']
          format: date-time
        severity:
          $ref: '#/components/schemas/LogSeverity'
        severityText:
          type: [string, 'null']
        body:
          type: string
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        traceId:
          oneOf:
            - $ref: '#/components/schemas/TraceId'
            - type: 'null'
        spanId:
          oneOf:
            - $ref: '#/components/schemas/SpanId'
            - type: 'null'
        attributes:
          type: object
          additionalProperties:
            type: string
    LogServices:
      type: object
      additionalProperties: false
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceIdentity'
    LogSearchResult:
      type: object
      additionalProperties: false
      required: [service, range, logs]
      properties:
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        range:
          $ref: '#/components/schemas/TimeRange'
        logs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LogRecord'
    TraceSpanServiceIdentity:
      type: object
      additionalProperties: false
      required: [name, namespace, environment]
      properties:
        name:
          type: string
          minLength: 1
        namespace:
          type: [string, 'null']
        environment:
          type: [string, 'null']
    TraceServices:
      type: object
      additionalProperties: false
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceIdentity'
    TraceSummary:
      type: object
      additionalProperties: false
      required: [traceId, rootSpanName, startTime, durationNanos, spanCount, error]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        rootSpanName:
          type: string
        startTime:
          type: string
          format: date-time
        durationNanos:
          type: integer
          format: int64
          minimum: 0
        spanCount:
          type: integer
          minimum: 1
        error:
          type: boolean
    TraceSearchResult:
      type: object
      additionalProperties: false
      required: [service, range, traces]
      properties:
        service:
          $ref: '#/components/schemas/ServiceIdentity'
        range:
          $ref: '#/components/schemas/TimeRange'
        traces:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TraceSummary'
    SpanKind:
      type: string
      enum: [UNSPECIFIED, INTERNAL, SERVER, CLIENT, PRODUCER, CONSUMER]
    SpanStatus:
      type: string
      enum: [UNSET, OK, ERROR]
    HttpMetadata:
      type: object
      additionalProperties: false
      required: [requestMethod, route, path, responseStatusCode, serverAddress, serverPort]
      properties:
        requestMethod:
          type: [string, 'null']
        route:
          type: [string, 'null']
        path:
          type: [string, 'null']
        responseStatusCode:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
        serverAddress:
          type: [string, 'null']
        serverPort:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
    TraceSpan:
      type: object
      additionalProperties: false
      required: [traceId, spanId, parentSpanId, name, service, telemetryOrigin, kind, status, startTime, startOffsetNanos, durationNanos, error, errorType, http]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        spanId:
          $ref: '#/components/schemas/SpanId'
        parentSpanId:
          oneOf:
            - $ref: '#/components/schemas/SpanId'
            - type: 'null'
        name:
          type: string
        service:
          $ref: '#/components/schemas/TraceSpanServiceIdentity'
        telemetryOrigin:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/SpanKind'
        status:
          $ref: '#/components/schemas/SpanStatus'
        startTime:
          type: string
          format: date-time
        startOffsetNanos:
          type: integer
          format: int64
          minimum: 0
        durationNanos:
          type: integer
          format: int64
          minimum: 0
        error:
          type: boolean
        errorType:
          type: [string, 'null']
        http:
          oneOf:
            - $ref: '#/components/schemas/HttpMetadata'
            - type: 'null'
    TraceDetail:
      type: object
      additionalProperties: false
      required: [traceId, startTime, durationNanos, spanCount, error, spans]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        startTime:
          type: string
          format: date-time
        durationNanos:
          type: integer
          format: int64
          minimum: 0
        spanCount:
          type: integer
          minimum: 1
        error:
          type: boolean
        spans:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TraceSpan'
    Problem:
      type: object
      description: RFC 9457 problem details without provider-specific query text.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
