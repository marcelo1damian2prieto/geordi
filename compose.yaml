name: geordi

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=7d"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  tempo:
    build:
      context: ./deploy/tempo
      dockerfile: Dockerfile
    image: geordi-tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  loki:
    build:
      context: ./deploy/loki
      dockerfile: Dockerfile
    image: geordi-loki:3.7.2
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  otel-collector:
    build:
      context: ./deploy/collector
      dockerfile: Dockerfile
    image: geordi-otel-collector:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8888:8888"
    depends_on:
      victoriametrics:
        condition: service_healthy
        restart: true
      tempo:
        condition: service_healthy
        restart: true
      loki:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.28.1}
        OTEL_JAVA_AGENT_SHA256: ${OTEL_JAVA_AGENT_SHA256:-faa89bdeebf9b1f52be4a4374689176717b02a59df2d8f8b6eb9aa39f9292589}
    image: geordi-backend:local
    depends_on:
      otel-collector:
        condition: service_healthy
        restart: true
      victoriametrics:
        condition: service_healthy
        restart: true
      tempo:
        condition: service_healthy
        restart: true
      loki:
        condition: service_healthy
        restart: true
    environment:
      SPRING_APPLICATION_JSON: '{"geordi":{"modules":{"self-observability":{"enabled":${GEORDI_MODULES_SELF_OBSERVABILITY_ENABLED:-true}},"metrics":{"enabled":${GEORDI_MODULES_METRICS_ENABLED:-true}},"traces":{"enabled":${GEORDI_MODULES_TRACES_ENABLED:-true}},"logs":{"enabled":${GEORDI_MODULES_LOGS_ENABLED:-true}},"service-map":{"enabled":${GEORDI_MODULES_SERVICE_MAP_ENABLED:-true}},"slos":{"enabled":${GEORDI_MODULES_SLOS_ENABLED:-true}}},"metrics":{"victoria-metrics":{"base-url":"http://victoriametrics:8428"}},"traces":{"tempo":{"base-url":"http://tempo:3200"}},"logs":{"loki":{"base-url":"http://loki:3100"}}}}'
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/geordi/slos.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=geordi,service.name=geordi-backend,deployment.environment.name=development,geordi.telemetry.origin=platform,geordi.platform.component=backend
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED: "false"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
    volumes:
      - ./deploy/slos/slos.yaml:/etc/geordi/slos.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.28.1}
        OTEL_JAVA_AGENT_SHA256: ${OTEL_JAVA_AGENT_SHA256:-faa89bdeebf9b1f52be4a4374689176717b02a59df2d8f8b6eb9aa39f9292589}
    image: geordi-demo:local
    depends_on:
      otel-collector:
        condition: service_healthy
        restart: true
      demo-downstream:
        condition: service_healthy
        restart: true
    environment:
      DEMO_DOWNSTREAM_URL: http://demo-downstream:8082/downstream/respond
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=geordi-demo,service.name=geordi-demo-service,deployment.environment.name=development,geordi.telemetry.origin=monitored
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: request_id,url_full
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  burn-demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.28.1}
        OTEL_JAVA_AGENT_SHA256: ${OTEL_JAVA_AGENT_SHA256:-faa89bdeebf9b1f52be4a4374689176717b02a59df2d8f8b6eb9aa39f9292589}
    image: geordi-demo:local
    depends_on:
      otel-collector:
        condition: service_healthy
        restart: true
      demo-downstream:
        condition: service_healthy
        restart: true
    environment:
      DEMO_DOWNSTREAM_URL: http://demo-downstream:8082/downstream/respond
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=geordi-burn-smoke,service.name=geordi-burn-smoke-service,deployment.environment.name=development,geordi.telemetry.origin=monitored
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED: "false"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
    ports:
      - "127.0.0.1:8083:8081"
    restart: unless-stopped

  demo-downstream:
    build:
      context: ./demo-downstream
      dockerfile: Dockerfile
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.28.1}
        OTEL_JAVA_AGENT_SHA256: ${OTEL_JAVA_AGENT_SHA256:-faa89bdeebf9b1f52be4a4374689176717b02a59df2d8f8b6eb9aa39f9292589}
    image: geordi-demo-downstream:local
    depends_on:
      otel-collector:
        condition: service_healthy
        restart: true
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=geordi-demo,service.name=geordi-demo-downstream-service,deployment.environment.name=development,geordi.telemetry.origin=monitored
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: geordi-frontend:local
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped

volumes:
  victoriametrics-data:
  tempo-data:
  loki-data:
