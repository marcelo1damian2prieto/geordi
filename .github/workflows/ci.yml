name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: chmod +x ./mvnw && ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deployment-configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose models
        run: |
          docker compose config --quiet
          docker compose --file compose.yaml --file compose.m19.yaml config --quiet
      - name: Verify M14 fixture orchestration contracts
        shell: pwsh
        run: |
          ./scripts/Test-GeordiM14ComposeScope.ps1 -Case Mutation
          ./scripts/Test-GeordiM14ComposeScope.ps1 -Case Dependencies
          ./scripts/Test-GeordiSchedulerIsolation.ps1 -SelfTest -M14PartialAcquisitionOnly
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(
            './scripts/verify-alert-history.ps1',
            './scripts/lib/GeordiSchedulerIsolation.ps1',
            './scripts/lib/GeordiAuthentication.ps1',
            './scripts/New-GeordiTestTls.ps1',
            './scripts/New-GeordiM19SmokeConfig.ps1',
            './scripts/verify-otel.ps1',
            './scripts/verify-metrics.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser rejected $path."
            }
            Write-Host "PASS: PowerShell syntax $path"
          }
      - name: Run OTEL smoke self-test
        shell: pwsh
        run: ./scripts/verify-otel.ps1 -SelfTest
      - name: Validate Collector configuration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector:0.157.0
          validate --config=/etc/otelcol/config.yaml

  local-stack-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, deployment-configuration]
    timeout-minutes: 25
    env:
      # Linux runners use ':' as the COMPOSE_FILE separator. This keeps
      # docker compose calls made inside PowerShell smoke scripts on M19 too.
      COMPOSE_FILE: compose.yaml:compose.m19.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral M19 TLS and OIDC material
        shell: pwsh
        run: |
          ./scripts/New-GeordiTestTls.ps1
          ./scripts/New-GeordiM19SmokeConfig.ps1
      - name: Validate M19 Compose configuration
        run: |
          test -s .runtime/m19/ca.pem
          test -s .runtime/m19/auth.p12
          test -s .runtime/m19/client-secret
          test -s .runtime/m19/control-secret
          test -s .runtime/m19/truststore.p12
          docker compose config --quiet
      - name: Build and start M19 local stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify OpenTelemetry flow
        shell: pwsh
        run: ./scripts/verify-otel.ps1 -TimeoutSeconds 120
      - name: Verify persisted metrics flow
        shell: pwsh
        run: ./scripts/verify-metrics.ps1 -TimeoutSeconds 150
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local stack and remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -rf .runtime/m19
