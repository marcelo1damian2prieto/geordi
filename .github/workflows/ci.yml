name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deployment-configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate Collector configuration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector:0.157.0
          validate --config=/etc/otelcol/config.yaml

  local-stack-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, deployment-configuration]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify OpenTelemetry flow
        shell: pwsh
        run: ./scripts/verify-otel.ps1 -TimeoutSeconds 120
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
