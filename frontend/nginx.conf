map $uri $geordi_route {
    default denied;
    ~^/api/auth/csrf$ csrf;
    ~^/api/auth/logout$ logout;
    ~^/api/me$ me;
    ~^/oauth2/authorization/geordi$ login;
    ~^/login/oauth2/code/geordi$ callback;
    ~^/api/alert-episodes/[^/]+/acknowledgements$ acknowledge;
    ~^/api/alert-policies/[^/]+/lifecycle-evaluations$ evaluate;
    ~^/api/ read;
    ~^/actuator/health probe;
}
log_format geordi_safe '{"event":"http","route":"$geordi_route","status":$status}';
# nginx request-parser diagnostics include raw request lines. Status outcomes remain
# observable in the bounded access events above; never send these diagnostics to CI.
error_log /dev/null;

server {
    # Override the image's inherited combined access log rather than adding a second log.
    access_log /dev/stdout geordi_safe;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
