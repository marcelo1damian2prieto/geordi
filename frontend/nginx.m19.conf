map $uri $geordi_route {
    default denied;
    ~^/api/auth/csrf$ csrf;
    ~^/api/auth/logout$ logout;
    ~^/api/me$ me;
    ~^/oauth2/authorization/geordi$ login;
    ~^/login/oauth2/code/geordi$ callback;
    ~^/api/alert-episodes/[^/]+/acknowledgements$ acknowledge;
    ~^/api/alert-policies/[^/]+/lifecycle-evaluations$ evaluate;
    ~^/api/ read;
    ~^/actuator/health probe;
}
log_format geordi_safe '{"event":"http","route":"$geordi_route","status":$status}';
# Nginx parser diagnostics include raw request lines before a location is selected.
# Keep them out of persistent container logs; the bounded access log records outcomes.
error_log /dev/null;

server {
    listen 443 ssl default_server;
    server_name geordi.localhost;
    access_log /dev/stdout geordi_safe;
    client_header_buffer_size 8k;
    large_client_header_buffers 2 32k;
    client_header_timeout 5s;

    ssl_certificate /etc/nginx/tls/geordi-cert.pem;
    ssl_certificate_key /etc/nginx/tls/geordi-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=3600" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $geordi_backend backend:8080;

    if ($host != geordi.localhost) { return 444; }
    if ($request_uri ~ "^.{8192}") { return 414; }

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$geordi_backend;
        proxy_set_header Host geordi.localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
    }

    location /oauth2/ {
        proxy_pass http://$geordi_backend;
        proxy_set_header Host geordi.localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
    }

    location /login/oauth2/ {
        proxy_pass http://$geordi_backend;
        proxy_set_header Host geordi.localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
    }

    location /actuator/health/ {
        proxy_pass http://$geordi_backend;
        proxy_set_header Host geordi.localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
    }

    location = /actuator/health {
        proxy_pass http://$geordi_backend;
        proxy_set_header Host geordi.localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
