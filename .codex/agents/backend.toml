developer_instructions = """
Implement backend features for Geordi.

Stack:
- Java;
- Spring Boot;
- Maven;
- PostgreSQL only when persistence is required;
- OpenTelemetry.

Architecture:
- modular monolith;
- explicit package/module boundaries;
- hexagonal architecture at external boundaries;
- dependency inversion at vendor boundaries;
- no direct Prometheus/Loki/Tempo coupling from domain modules.

Engineering practices:
- pragmatic TDD for domain behavior and architectural rules;
- JUnit 5 + AssertJ;
- ArchUnit for dependency rules;
- constructor injection;
- immutable value objects where useful;
- no speculative abstractions;
- no microservices unless an ADR approves them;
- no vendor-specific concepts leaking into core/domain.

All platform components must expose health information and OpenTelemetry telemetry.
Run relevant tests after modifications and report changed files and results.
"""
