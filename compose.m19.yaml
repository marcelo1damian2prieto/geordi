services:
  victoriametrics:
    volumes: !override
      - m19-victoriametrics-data:/victoria-metrics-data

  backend:
    depends_on:
      oidc-fixture:
        condition: service_healthy
    environment:
      GEORDI_OIDC_ISSUER: https://auth.localhost
      GEORDI_API_AUDIENCE: geordi-api
      GEORDI_BROWSER_CLIENT_ID: geordi-browser
      GEORDI_BROWSER_CLIENT_SECRET_FILE: /run/m19/client-secret
      GEORDI_PUBLIC_BASE_URL: https://geordi.localhost:8443
      SPRING_DATASOURCE_URL: jdbc:h2:file:/var/lib/geordi/alerts-m19/lifecycle;DB_CLOSE_ON_EXIT=FALSE
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/run/m19/truststore.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
      GEORDI_TEST_TRUSTSTORE_PASSWORD_FILE: /run/m19/truststore.password
      GEORDI_TEST_TRUSTSTORE_FILE: /run/m19/truststore.p12
    volumes:
      - type: bind
        source: ./.runtime/m19/client-secret
        target: /run/m19/client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/truststore.p12
        target: /run/m19/truststore.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/truststore.password
        target: /run/m19/truststore.password
        read_only: true
        bind:
          create_host_path: false
      - ./.runtime/m19/slos.yaml:/etc/geordi/slos.yaml:ro
      - ./.runtime/m19/alert-policies.yaml:/etc/geordi/alert-policies.yaml:ro
      - m19-alert-lifecycle-data:/var/lib/geordi/alerts-m19

    ports: !override []

  oidc-fixture:
    build:
      context: ./deploy/oidc-fixture
      dockerfile: Dockerfile
    image: geordi-m19-oidc-fixture:local
    environment:
      GEORDI_OIDC_ISSUER: https://auth.localhost
    volumes:
      - type: bind
        source: ./.runtime/m19/auth.p12
        target: /run/m19/auth.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/auth.password
        target: /run/m19/auth.password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/client-secret
        target: /run/m19/client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/control-secret
        target: /run/m19/control-secret
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        aliases:
          - auth.localhost
    ports:
      - "127.0.0.1:9444:8444"
      - "127.0.0.1:9445:443"
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/oidc-fixture.jar:/app/lib/*", "io.geordi.test.oidc.OidcFixtureServer", "health"]
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 15
    restart: unless-stopped

  frontend:
    depends_on: !reset []
    volumes:
      - ./frontend/nginx.m19.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./.runtime/m19/geordi-cert.pem
        target: /etc/nginx/tls/geordi-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/m19/geordi-key.pem
        target: /etc/nginx/tls/geordi-key.pem
        read_only: true
        bind:
          create_host_path: false
    ports: !override
      - "127.0.0.1:8443:443"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]

volumes:
  m19-alert-lifecycle-data:
  m19-victoriametrics-data:
