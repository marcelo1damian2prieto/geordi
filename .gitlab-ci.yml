stages:
  - verify
  - integration

variables:
  # Geordi builds Linux containers even when the GitLab Runner is Windows.
  # Prevent Git for Windows from converting Unix scripts such as mvnw to CRLF.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: "core.autocrlf"
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: "core.eol"
  GIT_CONFIG_VALUE_1: "lf"

default:
  interruptible: true
  hooks:
   pre_get_sources_script:
     - git config --global core.autocrlf false
     - git config --global core.eol lf

backend:
  stage: verify
  image: maven:3.9.11-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - backend/pom.xml
        - backend/.mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/
  script:
    - cd backend
    - chmod +x ./mvnw
    - ./mvnw -B -ntp verify
    - |
      set -eu
      jar=''
      count=0
      for candidate in target/geordi-backend-*.jar; do
        [ -f "$candidate" ] || continue
        case "$candidate" in
          *.original|*-sources.jar|*-javadoc.jar) continue ;;
        esac
        jar="$candidate"
        count=$((count + 1))
      done
      if [ "$count" -ne 1 ]; then
        echo "Expected exactly one verified backend JAR; found $count" >&2
        exit 1
      fi
      if [ -z "${CI_COMMIT_SHA:-}" ]; then
        echo "CI_COMMIT_SHA is required for verified artifact provenance" >&2
        exit 1
      fi
      hash="$(sha256sum "$jar" | awk '{print tolower($1)}')"
      if [ "${#hash}" -ne 64 ] || ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
        echo "Could not calculate a valid SHA-256 for verified backend JAR" >&2
        exit 1
      fi
      printf 'revision=%s\njar=%s\nsha256=%s' "$CI_COMMIT_SHA" "$(basename "$jar")" "$hash" > target/verified-artifact.properties
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/target/surefire-reports/
      - backend/target/failsafe-reports/
      - backend/target/pmd.xml
      - backend/target/spotbugsXml.xml
      - backend/target/geordi-backend-0.1.0-SNAPSHOT.jar
      - backend/target/verified-artifact.properties
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
        - backend/target/failsafe-reports/TEST-*.xml

frontend:
  stage: verify
  image: node:22.22.0-alpine3.23
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run typecheck
    - npm run lint
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/dist/

deployment_configuration:
  stage: verify
  tags:
    - geordi-docker-pwsh
  variables:
    GIT_STRATEGY: clone
  script:
    - docker version
    - docker compose version
    - pwsh --version
    - git ls-files --eol backend/mvnw
    - docker compose config --quiet
    - docker compose --file compose.yaml --file compose.m10.yaml config --quiet
    - docker compose --file compose.yaml --file compose.m12.yaml config --quiet
    - pwsh -NoProfile -Command '$env:GEORDI_M13_WEBHOOK_TOKEN_A="configuration-placeholder-a"; $env:GEORDI_M13_WEBHOOK_TOKEN_B="configuration-placeholder-b"; docker compose --file compose.yaml --file compose.m13.yaml config --quiet; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - docker run --rm -v "$CI_PROJECT_DIR/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector:0.157.0 validate --config=/etc/otelcol/config.yaml
    - docker run --rm -v "$CI_PROJECT_DIR/deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro" grafana/tempo:2.7.2 "-config.file=/etc/tempo/tempo.yaml" "-config.verify=true"
    - docker run --rm -v "$CI_PROJECT_DIR/deploy/loki/loki.yaml:/etc/loki/local-config.yaml:ro" grafana/loki:3.7.2 --config.file=/etc/loki/local-config.yaml --verify-config=true

local_stack_smoke:
  stage: integration
  tags:
    - geordi-docker-pwsh
  needs:
    - job: backend
      artifacts: true
    - job: frontend
      artifacts: false
    - job: deployment_configuration
      artifacts: false
  resource_group: geordi-local-stack
  timeout: 20m
  variables:
    GIT_STRATEGY: clone
    RUNNER_SCRIPT_TIMEOUT: 18m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 2m
  script:
    - git ls-files --eol backend/mvnw
    - docker compose down --volumes --remove-orphans
    - pwsh -NoProfile -Command '$p=ConvertFrom-StringData (Get-Content backend/target/verified-artifact.properties -Raw); if ($p.revision -ne $env:CI_COMMIT_SHA) { throw "Verified artifact revision mismatch" }; $jar=Join-Path backend/target $p.jar; if (!(Test-Path $jar) -or (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower() -ne $p.sha256) { throw "Verified artifact digest mismatch" }; New-Item -ItemType Directory -Force backend/.ci-artifact | Out-Null; Copy-Item $jar backend/.ci-artifact/application.jar; $env:GEORDI_BACKEND_DOCKER_TARGET="ci-runtime"; $env:GEORDI_SOURCE_REVISION=$p.revision; $env:GEORDI_VERIFIED_JAR_SHA256=$p.sha256; docker compose build --no-cache backend; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $labels=docker image inspect geordi-backend:local --format "{{json .Config.Labels}}" | ConvertFrom-Json; if ($labels."org.opencontainers.image.revision" -ne $p.revision -or $labels."io.geordi.verified-artifact.sha256" -ne $p.sha256) { throw "Runtime image provenance mismatch" }'
    - docker compose build --no-cache tempo loki otel-collector demo burn-demo demo-downstream frontend
    - docker compose up -d --wait --wait-timeout 180
    - pwsh -File ./scripts/verify-otel.ps1 -TimeoutSeconds 120
    - pwsh -File ./scripts/verify-metrics.ps1 -TimeoutSeconds 150
    - pwsh -File ./scripts/verify-traces.ps1 -TimeoutSeconds 180
    - pwsh -File ./scripts/verify-logs.ps1 -TimeoutSeconds 180
    - pwsh -File ./scripts/verify-service-map.ps1 -TimeoutSeconds 180
    - pwsh -File ./scripts/verify-slos.ps1 -TimeoutSeconds 180
    - pwsh -File ./scripts/verify-burn-rate.ps1 -TimeoutSeconds 180 -ExerciseProviderFailure
    - pwsh -File ./scripts/verify-alert-evaluation.ps1 -TimeoutSeconds 150
    - pwsh -File ./scripts/verify-alert-lifecycle.ps1 -TimeoutSeconds 240
    - pwsh -File ./scripts/verify-notification-delivery.ps1 -TimeoutSeconds 300
    - pwsh -File ./scripts/verify-alert-scheduling.ps1 -TimeoutSeconds 300
    - pwsh -File ./scripts/verify-alert-routing.ps1 -TimeoutSeconds 360
  after_script:
    - pwsh -NoProfile -Command '$env:GEORDI_M13_WEBHOOK_TOKEN_A="configuration-placeholder-a"; $env:GEORDI_M13_WEBHOOK_TOKEN_B="configuration-placeholder-b"; & docker compose --file compose.yaml --file compose.m13.yaml logs --no-color; if ($LASTEXITCODE -ne 0) { Write-Warning "Could not collect Compose logs."; exit 0 }'
    - pwsh -NoProfile -Command '$env:GEORDI_M13_WEBHOOK_TOKEN_A="configuration-placeholder-a"; $env:GEORDI_M13_WEBHOOK_TOKEN_B="configuration-placeholder-b"; & docker compose --file compose.yaml --file compose.m13.yaml down --volumes --remove-orphans; if ($LASTEXITCODE -ne 0) { Write-Warning "Could not clean up the Compose stack."; exit 0 }'
