stages:
  - verify
  - integration

variables:
  # Geordi builds Linux containers even when the GitLab Runner is Windows.
  # Prevent Git for Windows from converting Unix scripts such as mvnw to CRLF.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: "core.autocrlf"
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: "core.eol"
  GIT_CONFIG_VALUE_1: "lf"

default:
  interruptible: true
  hooks:
   pre_get_sources_script:
     - git config --global core.autocrlf false
     - git config --global core.eol lf

backend:
  stage: verify
  image: maven:3.9.11-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - backend/pom.xml
        - backend/.mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/
  script:
    - cd backend
    - chmod +x ./mvnw
    - ./mvnw -B -ntp verify
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/target/surefire-reports/
      - backend/target/failsafe-reports/
      - backend/target/pmd.xml
      - backend/target/spotbugsXml.xml
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
        - backend/target/failsafe-reports/TEST-*.xml

frontend:
  stage: verify
  image: node:22.22.0-alpine3.23
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run typecheck
    - npm run lint
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/dist/

deployment_configuration:
  stage: verify
  tags:
    - geordi-docker-pwsh
  variables:
    GIT_STRATEGY: clone
  script:
    - docker version
    - docker compose version
    - pwsh --version
    - git ls-files --eol backend/mvnw
    - docker compose config --quiet
    - docker run --rm -v "$CI_PROJECT_DIR/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector:0.157.0 validate --config=/etc/otelcol/config.yaml
    - docker run --rm -v "$CI_PROJECT_DIR/deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro" grafana/tempo:2.7.2 -config.file=/etc/tempo/tempo.yaml -config.verify=true

local_stack_smoke:
  stage: integration
  tags:
    - geordi-docker-pwsh
  needs:
    - job: backend
      artifacts: false
    - job: frontend
      artifacts: false
    - job: deployment_configuration
      artifacts: false
  resource_group: geordi-local-stack
  timeout: 20m
  variables:
    GIT_STRATEGY: clone
  script:
    - git ls-files --eol backend/mvnw
    - docker compose build --no-cache
    - docker compose up -d --wait --wait-timeout 180
    - pwsh -File ./scripts/verify-otel.ps1 -TimeoutSeconds 120
    - pwsh -File ./scripts/verify-metrics.ps1 -TimeoutSeconds 150
    - pwsh -File ./scripts/verify-traces.ps1 -TimeoutSeconds 180
  after_script:
    - docker compose logs --no-color || true
    - docker compose down --volumes --remove-orphans || true
